# Install in the nginx http context. Replace the example DNS and certificate paths.
map $request_method:$uri $mdr_backend {
    default 0;
    ~^[A-Z]+:/(api|sanctum)(/|$) 1;
    ~^[A-Z]+:/email/verify/ 1;
    ~^POST:/(login|register|logout|forgot-password|reset-password)/?$ 1;
}

# Omit IP, path, query, referrer, cookies and bodies.
log_format mdr_ops '$time_iso8601 id=$request_id status=$status duration=$request_time bytes=$body_bytes_sent';

server {
    listen 80;
    server_name relief.example.org;
    access_log /var/log/nginx/mdr-access.log mdr_ops;
    error_log /var/log/nginx/mdr-error.log crit;
    return 308 https://relief.example.org$request_uri;
}

server {
    listen 443 ssl;
    server_name relief.example.org;
    ssl_certificate /etc/letsencrypt/live/relief.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relief.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/mdr/current/frontend/dist;
    client_max_body_size 6m;
    access_log /var/log/nginx/mdr-access.log mdr_ops;
    error_log /var/log/nginx/mdr-error.log crit;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    if (-f /srv/mdr/shared/edge-maintenance) { return 503; }

    location ~ /\. { return 404; }
    location ~ ^/(storage|vendor|backend)(/|$) { return 404; }
    location = /index.html {
        expires -1;
        try_files $uri =404;
    }
    location /assets/ { try_files $uri =404; }
    location / {
        error_page 418 = @mdr_laravel;
        if ($mdr_backend) { return 418; }
        try_files $uri /index.html;
    }

    location @mdr_laravel {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/mdr/current/backend/public/index.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/mdr.sock;
    }
}
